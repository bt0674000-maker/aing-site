<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Aing的小窝 💕</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Serif SC',serif;background:#0a0518;color:#fff;overflow-x:hidden;min-height:100vh}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,107,157,0.3);border-radius:4px}
#starCanvas{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:0;pointer-events:none}
#petal-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}
.petal{position:absolute;top:-40px;animation:petalFall linear infinite}
.petal::before{content:'🌸';font-size:inherit}
@keyframes petalFall{0%{transform:translateY(0)rotate(0deg)scale(1);opacity:.7}100%{transform:translateY(110vh)rotate(720deg)scale(.2);opacity:0}}
.click-heart{position:fixed;pointer-events:none;z-index:999;font-size:30px;animation:heartFloat 1.3s ease-out forwards}
@keyframes heartFloat{0%{transform:translateY(0)scale(.3)rotate(0deg);opacity:1}100%{transform:translateY(-200px)scale(1.5)rotate(45deg);opacity:0}}
.main-container{position:relative;z-index:2;max-width:900px;margin:0 auto;padding:30px 20px 60px}
.header{text-align:center;padding:50px 0 20px;position:relative}
.header-glow{position:absolute;top:-80px;left:50%;transform:translateX(-50%);width:400px;height:200px;background:radial-gradient(ellipse,rgba(255,107,157,.12)0%,transparent 70%);pointer-events:none}
.site-title{font-size:clamp(2.6rem,7vw,4.2rem);font-weight:900;background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fbc2eb,#a18cd1,#fad0c4,#ff9a9e);background-size:400% 400%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:gradientMove 5s ease infinite;letter-spacing:8px}
@keyframes gradientMove{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.site-subtitle{font-family:'Dancing Script',cursive;font-size:1.3rem;color:rgba(255,255,255,.3);margin-top:10px;letter-spacing:5px}
.divider{display:flex;align-items:center;justify-content:center;gap:14px;margin:18px 0;opacity:.25}
.divider .line{flex:1;max-width:70px;height:1px;background:linear-gradient(90deg,transparent,#ff6b9d,transparent)}
.divider .icon{font-size:1rem;animation:twinkle 2s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.4}50%{opacity:1}}
.heart-wrapper{display:flex;justify-content:center;padding:8px 0 28px}
.heart-3d{position:relative;width:140px;height:140px;animation:heartBeat 1.4s ease-in-out infinite;cursor:pointer}
.heart-3d::before,.heart-3d::after{content:'';position:absolute;width:82px;height:128px;background:linear-gradient(135deg,#ff6b9d,#c084fc,#ff6b9d);background-size:200% 200%;border-radius:82px 82px 0 0;animation:heartGlow 2s ease infinite}
.heart-3d::before{left:0;transform:rotate(-45deg);transform-origin:0 100%}
.heart-3d::after{right:0;transform:rotate(45deg);transform-origin:100% 100%}
.heart-inner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:3;font-size:1.8rem;text-shadow:0 0 30px rgba(255,107,157,.9);color:#fff;text-align:center;line-height:1.3}
.heart-inner small{display:block;font-size:.65rem;opacity:.5;font-weight:400;letter-spacing:2px}
@keyframes heartBeat{0%,100%{transform:scale(1)}14%{transform:scale(1.15)}28%{transform:scale(1)}42%{transform:scale(1.08)}56%{transform:scale(1)}}
@keyframes heartGlow{0%,100%{filter:brightness(1);box-shadow:0 0 40px rgba(255,107,157,.3)}50%{filter:brightness(1.3);box-shadow:0 0 80px rgba(255,107,157,.7),0 0 160px rgba(192,132,252,.3)}}
.stats-row{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;margin:10px 0 20px}
.stat-item{text-align:center;background:rgba(255,255,255,.03);border-radius:16px;padding:12px 20px;min-width:100px;border:1px solid rgba(255,255,255,.04)}
.stat-item .num{font-size:1.8rem;font-weight:700;background:linear-gradient(180deg,#fff 60%,rgba(255,255,255,.4));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-item .lbl{font-size:.7rem;color:rgba(255,255,255,.3);letter-spacing:2px;margin-top:2px}
.main-day{text-align:center;padding:10px 0 15px}
.main-day .label{font-size:.85rem;color:rgba(255,255,255,.35);letter-spacing:6px;margin-bottom:4px}
.main-day .big-number{font-size:clamp(5rem,16vw,9rem);font-weight:900;background:linear-gradient(135deg,#f093fb,#f5576c,#4facfe,#43e97b,#f093fb);background-size:400% 400%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:gradientMove 4s ease infinite;line-height:1;display:inline-block}
.main-day .big-unit{font-size:1.6rem;color:rgba(255,255,255,.25);margin-left:4px}
.main-day .sub-info{font-size:.9rem;color:rgba(255,255,255,.3);margin-top:6px;letter-spacing:2px}
.main-day .quote{font-family:'Dancing Script',cursive;font-size:1.3rem;color:rgba(255,255,255,.15);margin-top:12px;min-height:2rem}
.progress-wrap{max-width:500px;margin:20px auto 30px;text-align:center}
.progress-wrap .plbl{font-size:.75rem;color:rgba(255,255,255,.25);letter-spacing:2px;margin-bottom:8px}
.progress-bar{width:100%;height:6px;background:rgba(255,255,255,.06);border-radius:10px;overflow:hidden}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#ff6b9d,#c084fc,#4facfe);background-size:200% 100%;border-radius:10px;transition:width 1.5s ease;animation:pGlow 2s ease infinite}
@keyframes pGlow{0%,100%{background-position:0% 0%}50%{background-position:100% 0%}}
.countdown-wrap{margin:25px 0 35px;text-align:center}
.countdown-wrap .clbl{font-size:.8rem;color:rgba(255,255,255,.3);letter-spacing:4px;margin-bottom:12px}
.countdown-row{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.cd-item{background:rgba(255,255,255,.05);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:16px 18px;min-width:82px;text-align:center;transition:all .35s ease}
.cd-item:hover{transform:translateY(-5px);background:rgba(255,255,255,.08);border-color:rgba(255,107,157,.2);box-shadow:0 8px 30px rgba(255,107,157,.08)}
.cd-item .num{font-size:2rem;font-weight:700;background:linear-gradient(180deg,#fff 60%,rgba(255,255,255,.4));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}
.cd-item .lbl{font-size:.65rem;color:rgba(255,255,255,.3);margin-top:5px;letter-spacing:3px}
.sec-title{text-align:center;font-size:1.15rem;font-weight:700;color:rgba(255,255,255,.5);margin:35px 0 18px;letter-spacing:5px}
.sec-title .hl{color:#ff6b9d}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:30px}
.card{background:rgba(255,255,255,.04);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.05);border-radius:22px;padding:22px 14px;text-align:center;transition:all .4s cubic-bezier(.175,.885,.32,1.275);position:relative;overflow:hidden;cursor:default}
.card::after{content:'';position:absolute;top:-60%;left:-60%;width:220%;height:220%;background:radial-gradient(circle at 30% 20%,rgba(255,107,157,.06),transparent 60%);opacity:0;transition:opacity .5s ease}
.card:hover::after{opacity:1}
.card:hover{transform:translateY(-7px)scale(1.02);border-color:rgba(255,107,157,.2);box-shadow:0 14px 40px rgba(255,107,157,.08)}
.card .emoji{font-size:2rem;display:block;margin-bottom:4px}
.card .name{font-weight:600;color:rgba(255,255,255,.8);font-size:.95rem}
.card .date{font-size:.7rem;color:rgba(255,255,255,.2);margin:2px 0 8px;letter-spacing:1px}
.card .d-num{font-size:1.8rem;font-weight:700;background:linear-gradient(135deg,#ff9a9e,#fad0c4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.card .d-unit{font-size:.7rem;color:rgba(255,255,255,.2)}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-bottom:30px}
.photo-item{aspect-ratio:1;border-radius:18px;overflow:hidden;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;font-size:3rem;transition:all .4s ease;position:relative}
.photo-item:hover{transform:scale(1.05);border-color:rgba(255,107,157,.3);box-shadow:0 8px 30px rgba(255,107,157,.1)}
.photo-item img{width:100%;height:100%;object-fit:cover;display:block}
.photo-item .ph{display:flex;flex-direction:column;align-items:center;gap:6px;color:rgba(255,255,255,.12);font-size:.65rem}
.timeline{position:relative;padding:20px 0 20px 32px;margin:10px 0 40px}
.timeline::before{content:'';position:absolute;left:10px;top:0;bottom:0;width:2px;background:linear-gradient(180deg,rgba(255,107,157,.05),rgba(192,132,252,.5),rgba(255,107,157,.05))}
.tl-item{position:relative;padding:16px 18px 16px 24px;margin-bottom:14px;background:rgba(255,255,255,.02);border-radius:16px;border:1px solid rgba(255,255,255,.03);transition:all .3s ease}
.tl-item:hover{background:rgba(255,255,255,.06);border-color:rgba(255,107,157,.1)}
.tl-item::before{content:'';position:absolute;left:-27px;top:22px;width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,#ff6b9d,#c084fc);box-shadow:0 0 16px rgba(255,107,157,.5)}
.tl-item .tl-date{font-size:.75rem;color:rgba(255,255,255,.25);font-family:'Dancing Script',cursive;letter-spacing:1px}
.tl-item .tl-title{font-size:1rem;font-weight:600;color:rgba(255,255,255,.8);margin:2px 0}
.tl-item .tl-desc{font-size:.85rem;color:rgba(255,255,255,.35)}
.footer{text-align:center;padding:30px 0 10px;border-top:1px solid rgba(255,255,255,.03);margin-top:30px}
.footer p{font-size:.8rem;color:rgba(255,255,255,.12);letter-spacing:3px}
.footer .red{color:#ff6b9d}
@media(max-width:500px){
.main-container{padding:24px 14px 60px}
.cd-item{min-width:70px;padding:14px 10px}
.cd-item .num{font-size:1.5rem}
.grid{grid-template-columns:1fr 1fr;gap:10px}
.photo-grid{grid-template-columns:repeat(3,1fr);gap:8px}
.card{padding:18px 10px}
.timeline{padding-left:24px}
.tl-item::before{left:-23px;width:10px;height:10px}
}
</style>
</head>
<body>
<canvas id="starCanvas"></canvas>
<div id="petal-container"></div>
<div class="main-container">

  <header class="header">
    <div class="header-glow"></div>
    <h1 class="site-title">✦ Aing的小窝 ✦</h1>
    <p class="site-subtitle">— 把每一天都过成纪念日 —</p>
  </header>

  <div class="divider"><span class="line"></span><span class="icon">✿</span><span class="line"></span></div>

  <div class="heart-wrapper">
    <div class="heart-3d">
      <div class="heart-inner">❤<small>Forever</small></div>
    </div>
  </div>

  <div class="main-day">
    <div class="label">♡ 相 爱 已 经 ♡</div>
    <div>
      <span class="big-number" id="mainDays">0</span>
      <span class="big-unit">天</span>
    </div>
    <div class="sub-info" id="mainDateInfo"></div>
    <div class="quote" id="randomQuote"></div>
  </div>

  <div class="stats-row">
    <div class="stat-item"><div class="num" id="statHours">0</div><div class="lbl">小时</div></div>
    <div class="stat-item"><div class="num" id="statMins">0</div><div class="lbl">分钟</div></div>
    <div class="stat-item"><div class="num" id="statSecs">0</div><div class="lbl">秒</div></div>
  </div>

  <div class="progress-wrap">
    <div class="plbl">✦ 今年进度 ✦</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="countdown-wrap">
    <div class="clbl">♡ 距 下 个 纪 念 日</div>
    <div class="countdown-row">
      <div class="cd-item"><div class="num" id="cdDays">00</div><div class="lbl">天</div></div>
      <div class="cd-item"><div class="num" id="cdHours">00</div><div class="lbl">时</div></div>
      <div class="cd-item"><div class="num" id="cdMins">00</div><div class="lbl">分</div></div>
      <div class="cd-item"><div class="num" id="cdSecs">00</div><div class="lbl">秒</div></div>
    </div>
  </div>

  <div class="divider"><span class="line"></span><span class="icon">✦</span><span class="line"></span></div>

  <div class="sec-title">✦ 我 们 的 <span class="hl">纪 念 日</span> ✦</div>
  <div class="grid" id="anniversaryGrid"></div>

  <div class="sec-title">✦ 爱 的 <span class="hl">相 册</span> ✦</div>
  <div class="photo-grid" id="photoGrid"></div>

  <div class="divider"><span class="line"></span><span class="icon">♡</span><span class="line"></span></div>

  <div class="sec-title">✦ 爱 的 <span class="hl">足 迹</span> ✦</div>
  <div class="timeline" id="timeline"></div>

  <footer class="footer">
    <p>✿ 从遇见你的那天起 <span class="red">❤</span> 每一天都是纪念日 ✿</p>
    <p style="margin-top:8px;font-size:.7rem;">2026 · Aing的小窝</p>
  </footer>

</div>

<script>
// ★★★ 配置区 - 改成你们的真实数据 ★★★
const CONFIG = {
  mainDate: '2026-08-19',
  herBirthday: '2026-08-19',
  hisBirthday: '2026-08-19',
  coupleName: 'Aing & 你',
  photos: [
    '', '', '', '', '', ''
  ],
  anniversaries: [
    { emoji: '💑', name: '在一起', date: '2026-08-19' },
    { emoji: '🎂', name: '她的生日', date: '2026-08-19' },
    { emoji: '🎂', name: '他的生日', date: '2026-08-19' },
  ],
  timeline: [
    { date: '2026-08-19', title: '💕 我们在一起了', desc: '故事开始的那一天。' },
  ],
  quotes: [
    '和你在一起的每一天，都是情人节。',
    '世界很大，但我的世界只有你。',
    '遇见你，是我这辈子最好的运气。',
    '余生很长，只想和你一起走。',
    '你是我藏在心底的温柔。',
    '有你在的地方，就是家。',
    '你是我的满目星河，也是我的温柔人间。',
    '我爱你，从这里一直到月亮，再绕回来。',
    '与你共度的时光，都是最好的时光。',
    '山河远阔，人间烟火，无一是你，无一不是你。',
    '你是我写过最美的情书。',
    '想牵你的手，从心动到古稀。',
  ]
};

function calcDays(dateStr) {
  const d = new Date(dateStr);
  const n = new Date();
  const t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const now = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  return Math.floor((now - t) / 86400000);
}

function calcDiff(target) {
  const diff = target - new Date();
  if (diff <= 0) return { d:0, h:0, m:0, s:0 };
  const t = Math.floor(diff / 1000);
  return { d: Math.floor(t/86400), h: Math.floor((t%86400)/3600), m: Math.floor((t%3600)/60), s: t%60 };
}

function pad(n) { return String(n).padStart(2, '0'); }
function fmt(d) {
  const dt = new Date(d);
  return `${dt.getFullYear()}年${dt.getMonth()+1}月${dt.getDate()}日`;
}

let statsInterval;
function updateStats() {
  const start = new Date(CONFIG.mainDate);
  const now = new Date();
  const diff = now - start;
  if (diff <= 0) return;
  const totalSec = Math.floor(diff / 1000);
  document.getElementById('statHours').textContent = Math.floor(totalSec / 3600);
  document.getElementById('statMins').textContent = Math.floor(totalSec / 60);
  document.getElementById('statSecs').textContent = totalSec;
}

function updateProgress() {
  const now = new Date();
  const y = now.getFullYear();
  const start = new Date(y, 0, 1);
  const end = new Date(y, 11, 31);
  const p = ((now - start) / (end - start)) * 100;
  document.getElementById('progressFill').style.width = Math.min(p, 100) + '%';
}

function initMain() {
  const days = calcDays(CONFIG.mainDate);
  document.getElementById('mainDays').textContent = days >= 0 ? days : 0;
  document.getElementById('mainDateInfo').textContent = `${fmt(CONFIG.mainDate)} · ${CONFIG.coupleName}`;
  const q = CONFIG.quotes[Math.floor(Math.random() * CONFIG.quotes.length)];
  document.getElementById('randomQuote').textContent = `「 ${q} 」`;
}

function updateCountdown() {
  const now = new Date();
  let next = null;
  for (const a of CONFIG.anniversaries) {
    const d = new Date(a.date);
    if (a.name.includes('生日')) {
      const ty = new Date(now.getFullYear(), d.getMonth(), d.getDate());
      const ny = new Date(now.getFullYear()+1, d.getMonth(), d.getDate());
      const t = ty > now ? ty : ny;
      if (!next || t < next) next = t;
    } else {
      if (d > now && (!next || d < next)) next = d;
    }
  }
  if (!next) return;
  const r = calcDiff(next);
  document.getElementById('cdDays').textContent = pad(r.d);
  document.getElementById('cdHours').textContent = pad(r.h);
  document.getElementById('cdMins').textContent = pad(r.m);
  document.getElementById('cdSecs').textContent = pad(r.s);
}

function renderAnniversaries() {
  const g = document.getElementById('anniversaryGrid');
  g.innerHTML = '';
  for (const a of CONFIG.anniversaries) {
    const days = calcDays(a.date);
    const c = document.createElement('div');
    c.className = 'card';
    c.innerHTML = `<span class="emoji">${a.emoji}</span><div class="name">${a.name}</div><div class="date">${fmt(a.date)}</div><div><span class="d-num">${days>=0?days:0}</span><span class="d-unit">天</span></div>`;
    g.appendChild(c);
  }
}

function renderPhotos() {
  const g = document.getElementById('photoGrid');
  g.innerHTML = '';
  const emojis = ['💑','🌸','🌹','🎂','💍','✈️','🌊','🎄'];
  for (let i = 0; i < 8; i++) {
    const d = document.createElement('div');
    d.className = 'photo-item';
    if (CONFIG.photos[i]) {
      d.innerHTML = `<img src="${CONFIG.photos[i]}" alt="photo" loading="lazy">`;
    } else {
      d.innerHTML = `<div class="ph"><span style="font-size:2.5rem">${emojis[i%emojis.length]}</span><span>等待上传</span></div>`;
    }
    g.appendChild(d);
  }
}

function renderTimeline() {
  const tl = document.getElementById('timeline');
  tl.innerHTML = '';
  for (const item of CONFIG.timeline) {
    const d = document.createElement('div');
    d.className = 'tl-item';
    d.innerHTML = `<div class="tl-date">${fmt(item.date)}</div><div class="tl-title">${item.title}</div><div class="tl-desc">${item.desc}</div>`;
    tl.appendChild(d);
  }
}

// 星星 + 流星
function initStars() {
  const canvas = document.getElementById('starCanvas');
  const ctx = canvas.getContext('2d');
  let w, h, stars = [], meteors = [];
  function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);
  const count = Math.floor((w * h) / 7000);
  for (let i = 0; i < count; i++) {
    stars.push({ x: Math.random()*w, y: Math.random()*h, r: Math.random()*1.8+0.3, a: Math.random(), sp: Math.random()*0.008+0.002 });
  }
  function draw() {
    ctx.clearRect(0, 0, w, h);
    for (const s of stars) {
      s.a += s.sp;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(255,255,255,${0.3+0.7*Math.abs(Math.sin(s.a))})`;
      ctx.fill();
    }
    if (Math.random() < 0.003) {
      meteors.push({ x: Math.random()*w, y: 0, len: Math.random()*70+30, sp: Math.random()*5+4, life: 1 });
    }
    for (let i = meteors.length - 1; i >= 0; i--) {
      const m = meteors[i];
      ctx.beginPath();
      ctx.moveTo(m.x, m.y);
      ctx.lineTo(m.x + m.len*0.4, m.y + m.len);
      ctx.strokeStyle = `rgba(255,255,255,${m.life*0.5})`;
      ctx.lineWidth = 1.2;
      ctx.stroke();
      m.x += m.sp*1.2;
      m.y += m.sp;
      m.life -= 0.018;
      if (m.life <= 0 || m.y > h) meteors.splice(i, 1);
    }
    requestAnimationFrame(draw);
  }
  draw();
}

// 花瓣
function initPetals() {
  const c = document.getElementById('petal-container');
  for (let i = 0; i < 25; i++) {
    const e = document.createElement('div');
    e.className = 'petal';
    const s = Math.random()*10+10;
    e.style.cssText = `left:${Math.random()*100}%;font-size:${s}px;animation-duration:${10+Math.random()*15}s;animation-delay:${Math.random()*10}s;opacity:${0.2+Math.random()*0.4}`;
    c.appendChild(e);
  }
}

// 点击爱心特效
document.addEventListener('click', function(e) {
  const hearts = ['❤️','💕','💗','💖','✨','💝'];
  const el = document.createElement('div');
  el.className = 'click-heart';
  el.textContent = hearts[Math.floor(Math.random() * hearts.length)];
  el.style.left = (e.clientX - 15) + 'px';
  el.style.top = (e.clientY - 15) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1400);
});

// 启动
initMain();
renderAnniversaries();
renderPhotos();
renderTimeline();
updateCountdown();
updateStats();
updateProgress();
statsInterval = setInterval(() => { updateStats(); updateCountdown(); }, 1000);
initStars();
initPetals();
</script>
